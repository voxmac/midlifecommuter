name: produce
# A new or changed songs/MCxx.json or cast/CASTx.json runs on a Modal GPU (credits, not Kaggle) and comes back as a
# GitHub Release + a review issue (GitHub emails you). A song with "pick" is prepped on this runner instead (CPU, free).
on:
  push:
    branches: [main]
    paths: ["songs/*.json", "cast/*.json", "episodes/*.json"]
  workflow_dispatch:
    inputs:
      id: {description: "Job id, e.g. MC01 or CAST1", required: true}
      runner: {description: "kaggle or modal (empty = automatic)", required: false}

permissions:
  contents: write
  issues: write
  actions: write

# no concurrency group: each job is its own Modal container, so runs may overlap (GitHub would drop queued ones)

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      FORCE_RUNNER: ${{ github.event.inputs.runner }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Which jobs
        id: j
        run: |
          if [ -n "${{ github.event.inputs.id }}" ]; then echo "list=${{ github.event.inputs.id }}" >> $GITHUB_OUTPUT
          else
            BEFORE="${{ github.event.before }}"; git cat-file -e "$BEFORE" 2>/dev/null || BEFORE=$(git rev-list --max-parents=0 HEAD)
            echo "list=$(git diff --name-only --diff-filter=AM $BEFORE HEAD -- 'songs/*.json' 'cast/*.json' 'episodes/*.json' | xargs -r -n1 basename | sed 's/.json//' | tr '\n' ' ')" >> $GITHUB_OUTPUT
          fi
      - name: Song prep (picked version -> vocals + lyric timing), CPU on this runner
        run: |
          for e in ${{ steps.j.outputs.list }}; do
            [ -f songs/$e.json ] && python -c "import json,sys;sys.exit(0 if json.load(open('songs/$e.json')).get('pick') else 1)" || continue
            sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
            pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
            pip install -q demucs faster-whisper soundfile
            D=out/$e; if python tools/song_prep.py songs/$e.json $D; then
              TAG="$e-prep-$(date -u +%m%d-%H%M)"
              gh release create "$TAG" $D/*.mp3 $D/*_vocals.wav $D/timing.json $D/report.json --title "$e prep" --notes "Vocals + lyric timing."
              python tools/song_body.py $D/report.json $REPO $TAG > body.md; gh issue create --title "Song prep: $e" --body-file body.md
            else gh issue create --title "Failed: $e prep" --body "Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; fi
          done
      - name: Run on Kaggle (free T4) where route.py says so; the rest goes to Modal below
        id: kg
        run: |
          rest=""
          for e in ${{ steps.j.outputs.list }}; do
            f=songs/$e.json; [ -f cast/$e.json ] && f=cast/$e.json; [ -f episodes/$e.json ] && f=episodes/$e.json
            [ -f "$f" ] || continue
            [ -f songs/$e.json ] && grep -q '"pick"' songs/$e.json && continue
            if [ "$(python tools/route.py $f)" = kaggle ] && bash tools/kaggle_push.sh $e $f; then
              gh issue create --title "Running: $e" --body "On Kaggle (free T4, slower). Results arrive by themselves (checked every 20 minutes)." > /dev/null
            else rest="$rest $e"; fi
          done
          echo "rest=$rest" >> $GITHUB_OUTPUT
      - name: Record Kaggle runs
        run: |
          git config user.name "midlife-bot"; git config user.email "bot@users.noreply.github.com"
          mkdir -p state; git add -A state; git diff --cached --quiet && exit 0
          git commit -q -m "kaggle pending [skip ci]"; for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          gh api -X POST repos/$REPO/actions/workflows/collect.yml/dispatches -f ref=main   # poll until the Kaggle jobs finish
      - name: Run on Modal
        run: |
          pip install -q modal
          for e in ${{ steps.kg.outputs.rest }}; do
            f=songs/$e.json; [ -f cast/$e.json ] && f=cast/$e.json; [ -f episodes/$e.json ] && f=episodes/$e.json
            [ -f "$f" ] || { echo "::error::no spec for $e"; continue; }
            [ -f songs/$e.json ] && grep -q '"pick"' songs/$e.json && continue      # prepped above, no GPU
            O=out/$e; mkdir -p $O
            export MODAL_GPU=$(python -c "import json;print(json.load(open('$f')).get('gpu','T4'))")
            PI=$(gh issue create --title "Running: $e" --body "Live log every 5 minutes. Closed when the job ends." | grep -oE '[0-9]+$')
            ( modal run tools/modal_job.py --spec $f --out $O > $O/console.log 2>&1 || true ) &
            MP=$!
            while kill -0 $MP 2>/dev/null; do
              sleep 300; kill -0 $MP 2>/dev/null || break
              { echo "$(date -u +%H:%M) UTC"; echo '```'; tail -c 2500 $O/console.log | tr -d '\r'; echo '```'; } > tick.md
              gh issue comment $PI --body-file tick.md || true
            done
            gh issue close $PI || true
            bash tools/publish.sh $e $O "Modal: $(cat $O/modal.json 2>/dev/null | tr -d '\n ')"
          done
